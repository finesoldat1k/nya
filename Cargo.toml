[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/stdlib",
    "crates/lexer",
    "crates/parser",
    "crates/ast",
    "crates/diagnostics",
    "crates/resolver",
    "crates/ty",
    "crates/borrow",
    "crates/hir",
    "crates/codegen",
    "crates/context",
    "crates/types",
    "crates/manifest",
    "crates/builder",
    "crates/cache",
    "crates/dep_resolver",
    "crates/registry",
    "crates/driver",
    "crates/test",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["nya contributors"]
repository = "https://github.com/finesoldat1k/nya"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
once_cell = "1.19"
parking_lot = "0.12"
indexmap = "2.0"
smallvec = "1.11"
bitflags = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
indicatif = "0.17"
ignore = "0.4"
walkdir = "2.4"
glob = "0.3"
blake3 = "1.5"
xxhash-rust = "0.8"
tokio = { version = "1.38", features = ["full"] }
inkwell = { version = "0.11.0", features = ["llvm17-0"] }
llvm-sys = "170"
pretty_assertions = "1.4"
semver = "1.0"

[profile.dev]
opt-level = 1
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
debug = true